name: Daily FinOps Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  finops-pipeline:
    name: FinOps Data Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Billing Data
        run: |
          mkdir -p data/raw data/processed/lake
          python src/ingestion/generate_billing_data.py

      - name: Run DuckDB Partition Pipeline
        run: |
          python src/ingestion/partition_data.py

      - name: Run Data Quality Gate
        run: |
          python -m src.quality.data_validator

      - name: Run Anomaly Detection (Dry Run)
        run: |
          python -m src.alerts.anomaly_notifier --dry-run
